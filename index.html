<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Umair Ali Bhai! 🥳✨</title>
    <!-- Confetti & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d0d11;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Glowing Background Sphere */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00d4ff);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8) translate(-50px, -50px); }
            100% { transform: scale(1.2) translate(50px, 50px); }
        }

        .main-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* TikTok Style Animated Header */
        .tiktok-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            background: linear-gradient(45deg, #ff007f, #ffcc00, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 2s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            from { filter: drop-shadow(0 0 5px #ff007f); }
            to { filter: drop-shadow(0 0 20px #00d4ff); }
        }

        /* 3D Glass Photo Frame Carousel */
        .photo-frame-container {
            position: relative;
            width: 220px;
            height: 260px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(1.1) rotate(2deg);
            transition: all 0.8s ease-in-out;
        }

        .slide-img.active {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .name-tag {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 10px;
            color: #fff;
            letter-spacing: 1px;
        }

        .bhai-highlight {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }

        /* Music Player Style Button */
        .play-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.4);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 0, 127, 0.7);
        }

        /* Wishing Card Popup */
        .wish-card {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,204,0,0.5);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wish-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="main-card">
        <div class="tiktok-title">Happy Birthday</div>
        
        <!-- Animated Multi-Photo Frame -->
        <div class="photo-frame-container">
            <img class="slide-img active" src="bhai1.jpg" onerror="this.src='https://i.ibb.co/L840p0S/avatar.png'">
            <img class="slide-img" src="bhai2.jpg" onerror="this.src='https://i.ibb.co/L840p0S/avatar.png'">
            <img class="slide-img" src="bhai3.jpg" onerror="this.src='https://i.ibb.co/L840p0S/avatar.png'">
            <img class="slide-img" src="bhai4.jpg" onerror="this.src='https://i.ibb.co/L840p0S/avatar.png'">
        </div>

        <div class="name-tag">
            👑 <span class="bhai-highlight">UMAIR ALI BHAI</span> 👑
        </div>

        <!-- Audio Player (Optional Music) -->
        <audio id="bgMusic" loop>
            <source src="song.mp3" type="audio/mpeg">
        </audio>

        <button class="play-btn" onclick="startCelebration()">
            <i class="fa-solid fa-heart"></i> TAP FOR SURPRISE 🎉
        </button>

        <div class="wish-card" id="wishCard">
            <h3 style="color: #ffcc00; margin-bottom: 10px;">🎂 Best Bhai Ever! 🎂</h3>
            <p>
                Allah aapko hamesha khush rakhe, lambi aur sehat wali zindagi de, aur aapki har khwahish poori farmaye! ✨
            </p>
            <p style="margin-top: 10px; font-weight: bold; color: #ff007f;">
                ~ Happy Birthday Bhai! ❤️
            </p>
        </div>
    </div>

    <script>
        // Automatic Smooth Photo Transition
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide-img');

        function nextSlide() {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }

        setInterval(nextSlide, 2500); // Har 2.5 seconds baad photo change hogi

        // Celebration Trigger (Music + Explosive Confetti)
        function startCelebration() {
            document.querySelector('.play-btn').style.display = 'none';
            document.getElementById('wishCard').style.display = 'block';

            // Try playing background song if song.mp3 is uploaded
            var music = document.getElementById("bgMusic");
            music.play().catch(e => console.log("Audio play blocked or file missing"));

            // Full Screen Confetti Blast
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;

            (function frame() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff007f', '#ffcc00', '#00d4ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#7928ca', '#ffcc00', '#ffffff']
                });

                requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
