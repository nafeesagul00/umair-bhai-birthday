<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Umair Bhai! 🥳✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(-45deg, #ff007f, #7928ca, #00d4ff, #ffcc00);
            background-size: 400% 400%;
            animation: partyBG 8s ease infinite;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes partyBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Balloons */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 45px;
            height: 60px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.85;
            animation: floatUp 7s linear infinite;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 21px;
            width: 2px;
            height: 15px;
            background: rgba(255, 255, 255, 0.7);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
        }

        .main-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            padding: 30px 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .tiktok-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.3rem;
            color: #fff;
            text-shadow: 3px 3px 0px #ff007f, 5px 5px 0px #000;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Photo Frame Carousel */
        .photo-frame-container {
            position: relative;
            width: 220px;
            height: 240px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.3);
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: all 0.8s ease-in-out;
        }

        .slide-img.active {
            opacity: 1;
        }

        .name-tag {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 10px;
            color: #fff;
        }

        .bhai-highlight {
            color: #ffcc00;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0px #000;
            font-size: 1.8rem;
        }

        .play-btn {
            background: linear-gradient(45deg, #ffcc00, #ff007f);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #00d4ff, #ffcc00);
        }

        /* Dedicated Music Player Control */
        .music-control-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 8px 18px;
            font-size: 0.9rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .wish-card {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #ffcc00;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wish-card p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Floating Balloons -->
    <div class="balloon" style="left: 8%; background: #ff007f; animation-duration: 6s;"></div>
    <div class="balloon" style="left: 25%; background: #00d4ff; animation-duration: 8s; animation-delay: 1s;"></div>
    <div class="balloon" style="left: 50%; background: #ffcc00; animation-duration: 5s; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 75%; background: #7928ca; animation-duration: 7s; animation-delay: 0.5s;"></div>
    <div class="balloon" style="left: 90%; background: #ff007f; animation-duration: 9s; animation-delay: 3s;"></div>

    <!-- Reliable Direct Birthday Audio Track -->
    <audio id="birthdayAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3" type="audio/mpeg">
    </audio>

    <div class="main-card">
        <div class="tiktok-title">🎉 HAPPY BIRTHDAY! 🎉</div>
        
        <!-- Multi-Photo Frame -->
        <div class="photo-frame-container">
            <img class="slide-img active" src="bhai1.jpg" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500'">
            <img class="slide-img" src="bhai2.jpg" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500'">
            <img class="slide-img" src="bhai3.jpg" onerror="this.src='https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500'">
        </div>

        <div class="name-tag">
            👑 <span class="bhai-highlight">UMAIR BHAI</span> 👑
        </div>

        <button class="play-btn" onclick="startCelebration()">
            🎁 TAP FOR SURPRISE! 🎉
        </button>

        <br>
        <button class="music-control-btn" onclick="toggleAudio()">
            <i class="fa-solid fa-music" id="musicIcon"></i> <span id="musicText">Play Music 🎵</span>
        </button>

        <div class="wish-card" id="wishCard">
            <h3 style="color: #ffcc00; margin-bottom: 10px; font-family: 'Fredoka One', cursive;">🎂 Best Bhai Ever! 🎂</h3>
            <p>
                Allah aapko hamesha khush rakhe, lambi aur sehat wali zindagi de, aur aapki har khwahish poori farmaye! ✨
            </p>
            <p style="margin-top: 10px; font-weight: bold; color: #ff007f;">
                ~ Happy Birthday Bhai! ❤️
            </p>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide-img');
        const audio = document.getElementById("birthdayAudio");

        function nextSlide() {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }

        setInterval(nextSlide, 2500);

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                document.getElementById('musicText').innerText = "Pause Music ⏸️";
            } else {
                audio.pause();
                document.getElementById('musicText').innerText = "Play Music 🎵";
            }
        }

        function startCelebration() {
            document.querySelector('.play-btn').style.display = 'none';
            document.getElementById('wishCard').style.display = 'block';

            // Play Music automatically on surprise button tap
            audio.play().then(() => {
                document.getElementById('musicText').innerText = "Pause Music ⏸️";
            }).catch(e => console.log("Playback error:", e));

            // Confetti Animation
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;

            (function frame() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff007f', '#ffcc00', '#00d4ff']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#7928ca', '#ffcc00', '#ffffff']
                });

                requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
